[package]
name = "silero"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/Findit-AI/silero"
homepage = "https://github.com/Findit-AI/silero"
documentation = "https://docs.rs/silero"
description = "Production-oriented Rust wrapper for the Silero VAD ONNX model."
keywords = ["vad", "voice-detection", "silero-vad", "speech", "onnx"]
categories = ["multimedia::audio", "science"]
license = "MIT OR Apache-2.0"
readme = "README.md"
include = [
  "Cargo.toml",
  "README.md",
  "THIRD_PARTY_NOTICES.md",
  "LICENSE-APACHE",
  "LICENSE-MIT",
  "models/silero_vad.onnx",
  "src/**",
  "build.rs",
  "examples/**",
  "tests/**",
]

[features]
default = ["bundled"]

# The ONNX/ort backend: the `OnnxBackend` (`Session`) implementation of the
# `VadBackend` seam, plus the `ort` dependency and the ORT-typed options and
# error variants. Default-on. Turning it off (`--no-default-features`) yields a
# logic-only crate — the backend-agnostic detector, segmenter, options, and the
# `VadBackend` trait — with no `ort` dependency compiled at all.
onnx = ["dep:ort"]
# The bundled `silero_vad.onnx` model bytes. Only useful with the ONNX backend,
# so it pulls in `onnx`.
bundled = ["onnx"]
serde = ["dep:serde", "dep:humantime-serde"]

# ORT execution-provider passthroughs. Off by default; each implies `onnx` and
# links the EP into ort-sys — downstream callers must still register the EP at
# runtime via `Session::builder().with_execution_providers([...])`. The Silero
# graph is dominated by `If`/`Loop` control flow around `LSTM`, which CoreML
# cannot take ownership of, so on macOS registration is a no-op and the model
# stays on CPU regardless. CUDA/DirectML have not been measured here.
coreml   = ["onnx", "ort/coreml"]
directml = ["onnx", "ort/directml"]
cuda     = ["onnx", "ort/cuda"]
rocm     = ["onnx", "ort/rocm"]
tensorrt = ["onnx", "ort/tensorrt"]
openvino = ["onnx", "ort/openvino"]

[dependencies]
ort = { version = "2.0.0-rc.12", optional = true }
thiserror = "2"

serde = { version = "1", optional = true, features = ["derive"] }
humantime-serde = { version = "1", optional = true }

[dev-dependencies]
hound = "3"
serde_json = "1"

[[example]]
name = "detect_file"
path = "examples/detect_file.rs"
required-features = ["onnx"]

[[example]]
name = "streaming"
path = "examples/streaming.rs"
required-features = ["onnx"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[workspace.lints.rust]
rust_2018_idioms = "warn"
single_use_lifetimes = "warn"
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(all_tests)',
  'cfg(tarpaulin)',
] }
