[package]
name = "silero"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/Findit-AI/silero"
homepage = "https://github.com/Findit-AI/silero"
documentation = "https://docs.rs/silero"
description = "Production-oriented Rust wrapper for the Silero VAD ONNX model."
keywords = ["vad", "voice-detection", "silero-vad", "speech", "onnx"]
categories = ["multimedia::audio", "science"]
license = "MIT OR Apache-2.0"
readme = "README.md"
include = [
  "Cargo.toml",
  "README.md",
  "THIRD_PARTY_NOTICES.md",
  "LICENSE-APACHE",
  "LICENSE-MIT",
  "models/silero_vad.onnx",
  "src/**",
  "build.rs",
  "examples/**",
  "tests/**",
]

[features]
default = ["bundled"]
bundled = []
serde = ["dep:serde", "dep:humantime-serde"]

# ORT execution-provider passthroughs. Off by default; enabling a feature only
# links the EP into ort-sys — downstream callers must still register the EP at
# runtime via `Session::builder().with_execution_providers([...])`. The Silero
# graph is dominated by `If`/`Loop` control flow around `LSTM`, which CoreML
# cannot take ownership of, so on macOS registration is a no-op and the model
# stays on CPU regardless. CUDA/DirectML have not been measured here.
coreml   = ["ort/coreml"]
directml = ["ort/directml"]
cuda     = ["ort/cuda"]
rocm     = ["ort/rocm"]
tensorrt = ["ort/tensorrt"]
openvino = ["ort/openvino"]

[dependencies]
ort = "2.0.0-rc.12"
thiserror = "2"

serde = { version = "1", optional = true, features = ["derive"] }
humantime-serde = { version = "1", optional = true }

[dev-dependencies]
hound = "3"
serde_json = "1"

[[example]]
name = "detect_file"
path = "examples/detect_file.rs"

[[example]]
name = "streaming"
path = "examples/streaming.rs"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[workspace.lints.rust]
rust_2018_idioms = "warn"
single_use_lifetimes = "warn"
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(all_tests)',
  'cfg(tarpaulin)',
] }
